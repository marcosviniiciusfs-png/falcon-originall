  <body>
    <noscript>
      <img
        height="1"
        width="1"
        style="display:none"
        src="https://www.facebook.com/tr?id=1528207522323512&amp;ev=PageView&amp;noscript=1"
        alt=""
      />
    </noscript>
    <script>
      // SPA fallback handshake: 404.html stashes the original path in ?p=…,
      // here we restore it via history.replaceState before React mounts.
      (function () {
        var l = window.location;
        if (l.search.indexOf("?p=") === 0 || l.search.indexOf("&p=") !== -1) {
          var q = {};
          l.search.slice(1).split("&").forEach(function (kv) {
            var i = kv.indexOf("=");
            q[kv.slice(0, i)] = kv.slice(i + 1).replace(/~and~/g, "&");
          });
          if (q.p !== undefined) {
            window.history.replaceState(
              null,
              null,
              l.pathname.slice(0, -1) + (q.p || "") +
                (q.q ? "?" + q.q : "") + l.hash
            );
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
